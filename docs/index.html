<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenBerry | Store</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: Tebex "Game Store" template, clean and quiet, the products do the selling
   IDEA: genberry.tebex.store: slim top bar (store name, Log in, Basket), package grid, payment-badge footer
   PICTURE: each credit pack drawn as a growing pile of berries
   COLOUR+TYPE: near-black #0f1014 page, #17181e cards, berry red #ef5965 accent; Inter
   LAYOUT: top bar, short intro, responsive card grid, footer; two columns on phones */
:root{color-scheme:dark;--bg:#0f1014;--card:#17181e;--card2:#1e2028;--line:#272a35;--ink:#f2f3f7;--mute:#9a9fb0;--acc:#ef5965;--acc2:#d9434f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:rgba(15,16,20,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand img{display:block;height:32px;width:32px;image-rendering:pixelated}
.top{display:flex;gap:6px;align-items:center}
.top button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:8px}
.top button:hover{background:var(--card)}
.head{width:22px;height:22px;border-radius:5px;image-rendering:pixelated;display:block}.head.big{width:56px;height:56px;border-radius:10px}
.top .count{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
.intro{padding:44px 0 26px;text-align:center}.intro p{max-width:560px;margin-left:auto!important;margin-right:auto!important}
.intro h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.5px}
.intro p{margin:8px 0 0;color:var(--mute)}
.cat{display:flex;align-items:center;justify-content:space-between;margin:10px 0 16px;gap:10px;flex-wrap:wrap}
.cat h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:56px}
.pkg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.pkg:hover{transform:translateY(-3px);border-color:#3a3e4d}
.pkg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.img{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 50% 65%,#2a1d24,#17181e 72%)}
.img img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5))}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:16px}
.body p{margin:0;color:var(--mute);font-size:13.5px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;gap:8px}
.foot b{font-size:18px;white-space:nowrap}
.btn{appearance:none;border:0;border-radius:9px;background:var(--acc);color:#fff;font:700 14px Inter,sans-serif;padding:10px 14px;cursor:pointer;min-height:44px;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn:focus-visible,input:focus-visible,.top button:focus-visible{outline:2px solid #fff;outline-offset:2px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:16px Inter,sans-serif;padding:11px 12px;min-height:44px}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer .wrap{padding-top:28px;padding-bottom:32px;display:grid;gap:14px}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay span{background:#fff;color:#111;font-weight:800;font-size:11px;border-radius:5px;padding:5px 8px}
.links{display:flex;gap:18px;flex-wrap:wrap}
.links a:hover{color:var(--ink)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
.shade.open{display:block}
.panel{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:21;display:flex;flex-direction:column}
.panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.pb{padding:20px;flex:1;overflow:auto}
.pf{padding:20px;border-top:1px solid var(--line)}
.x{appearance:none;border:0;background:var(--card2);color:var(--ink);width:36px;height:36px;border-radius:9px;font-size:18px;cursor:pointer;flex:none}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{width:52px;height:52px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none}
.line .t img{width:44px;height:44px;object-fit:contain}
.muted{color:var(--mute);font-size:13px}
.err{color:#ff8a8a;font-size:13px;min-height:1.2em;margin:4px 0}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(560px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;z-index:21;display:none}
.dlg.open{display:block}
.dlg .img{aspect-ratio:16/8}
.dlg .in{padding:20px}
.dlg h3{margin:0;font-size:22px}
.dlg ul{color:var(--mute);padding-left:18px;margin:12px 0 18px}
.legal{max-width:780px;padding-top:40px;padding-bottom:60px}.legal h1{font-size:30px;margin:0 0 4px}.legal h2{font-size:18px;margin:26px 0 6px}.legal p,.legal li{color:#c9ccd8}.legal a.back{display:inline-block;margin-bottom:18px;color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;transition:transform .25s;z-index:30}
.toast.show{transform:translateX(-50%)}
@media(max-width:560px){.top .lbl{display:none}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.body{padding:12px}.foot{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){.pkg,.panel,.toast{transition:none}}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="brand" href="#"><img src="img/favicon.png" alt="">GenBerry</a>
  <div class="top">
    <button id="loginBtn"><span id="loginIcon"></span><span class="lbl" id="loginLbl">Log in</span></button>
    <button id="basketBtn"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4H2V2h4.8l.9 2H22l-3.4 8.2a2 2 0 0 1-1.8 1.3H8.1L7 15.5h12v2H5l2.4-4.4L5.2 4Z"/></svg><span class="lbl">Basket</span><span class="count" id="count" hidden>1</span></button>
  </div>
</div></header>

<main class="wrap" id="shop">
  <div class="intro">
    <img src="img/logo.png" alt="" style="height:clamp(70px,10vw,110px);width:auto;display:block;margin:0 auto 10px">

  </div>
  <div class="cat"><h2>Credits</h2><span class="muted">Delivered in game within a minute</span></div>
  <div class="grid" id="grid"></div>
</main>

<main class="wrap legal" id="legal" hidden></main>

<footer><div class="wrap">
  <div class="pay"><span>Apple Pay</span><span>G Pay</span><span>Mastercard</span><span>VISA</span><span>AMEX</span></div>
  <div>Payments are processed securely by Stripe. GenBerry is not affiliated with Mojang AB or Microsoft.</div>
  <div class="links"><span>© 2026 GenBerry</span><a href="#terms">Terms of Service</a><a href="#refunds">Refund Policy</a><a href="#privacy">Privacy Policy</a><a href="https://discord.gg/akXMTM5XMy">Support (Discord)</a></div>
</div></footer>

<div class="shade" id="shade"></div>
<aside class="panel" id="login"></aside>
<aside class="panel" id="basket"></aside>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
{
/* Paste each Stripe payment link here (from /stripe links in game). Empty = "Coming soon". */
const PACKS = [
  {credits:500,   price:4.99,  link:""},
  {credits:750,   price:7.49,  link:""},
  {credits:1000,  price:9.99,  link:""},
  {credits:2500,  price:24.99, link:""},
  {credits:5000,  price:49.99, link:""},
  {credits:7500,  price:74.99, link:""},
  {credits:10000, price:99.99, link:""}
];
const fmt = n => n.toLocaleString('en-US');
const usd = n => '$' + n.toFixed(2);
let user = '', basket = -1;
try { user = localStorage.getItem('genberry-user') || ''; } catch (e) {}

const berries = (i) => `<img src="img/pack${i + 1}.png" alt="" loading="lazy">`;

const $ = id => document.getElementById(id);
$('grid').innerHTML = PACKS.map((p, i) => `
  <article class="pkg" tabindex="0" data-i="${i}">
    <div class="img">${berries(i)}</div>
    <div class="body">
      <h3>${fmt(p.credits)} Credits</h3>
      <p>Purchase credits to make in-game purchases.</p>
      <div class="foot"><b>${usd(p.price)}</b><button class="btn" data-add="${i}">${p.link ? 'Add to basket' : 'Coming soon'}</button></div>
    </div>
  </article>`).join('');

const shade = $('shade');
const closeAll = () => { ['login', 'basket'].forEach(id => $(id).classList.remove('open')); $('dlg').classList.remove('open'); shade.classList.remove('open'); };
shade.onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2200); };
const save = () => { try { user ? localStorage.setItem('genberry-user', user) : localStorage.removeItem('genberry-user'); } catch (e) {} };
const openPanel = id => { closeAll(); $(id).classList.add('open'); shade.classList.add('open'); };

const PERSON = `<svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5Z"/></svg>`;
/* player's face from mc-heads; if images from other sites are blocked it quietly falls back to the berry */
let userId = '';
try { userId = localStorage.getItem('genberry-uuid') || ''; } catch (e) {}
const head = (name, big) => `<img class="head${big ? ' big' : ''}" src="https://mc-heads.net/avatar/${encodeURIComponent(userId || name)}/64" alt="" onerror="this.onerror=null;this.src='img/favicon.png'">`;
/* looks the name up so we get the real capitals (and know the player exists). null = not found, false = lookup unavailable */
const lookup = async name => {
  try {
    const r = await fetch('https://playerdb.co/api/player/minecraft/' + encodeURIComponent(name));
    const j = await r.json();
    if (!j.success) return null;
    return { name: j.data.player.username, id: j.data.player.raw_id || j.data.player.id };
  } catch (e) { return false; }
};
const renderLogin = () => {
  $('loginLbl').textContent = user || 'Log in';
  $('loginIcon').innerHTML = user ? head(user) : PERSON;
  $('login').innerHTML = `<div class="ph">${user ? 'Your account' : 'Log in'}<button class="x" data-close>×</button></div>
    <div class="pb">${user ? `
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${head(user, true)}<div><b>${user}</b><div class="muted">Purchases go to this player</div></div></div><button class="btn ghost full" id="logout">Log out</button>` : `
      <form id="lf"><p class="muted" style="margin-top:0">Enter your Minecraft username so we know who to deliver to.</p>
      <input id="un" maxlength="16" autocomplete="off" placeholder="Minecraft username">
      <div class="err" id="ue"></div><button class="btn full" type="submit">Continue</button></form>`}</div>`;
  $('login').querySelector('[data-close]').onclick = closeAll;
  if (user) $('logout').onclick = () => { user = ''; userId = ''; try { localStorage.removeItem('genberry-uuid'); } catch (e) {} save(); const UPDATED = '23 November 2026';
const LEGAL = {
terms: ['Terms of Service', `
<p>These terms apply when you buy anything from the GenBerry store ("we", "us") for the Minecraft server genberry.minehut.gg. By making a purchase you agree to them.</p>
<h2>What you're buying</h2>
<p>You're buying credits, a virtual in-game currency, for the Minecraft account whose username you enter. Credits have no real-world cash value, can't be exchanged for money, and can only be used on GenBerry. Bigger packs don't come with any extra rights.</p>
<h2>Delivery</h2>
<p>Credits are delivered automatically, usually within a minute of payment, even if you're offline. Make sure the username is spelled correctly. If you typed it wrong, contact us on Discord and we'll move the credits to the right account.</p>
<h2>Your account</h2>
<p>Purchases are tied to the Minecraft account they were made for and can't be transferred. If an account is banned for breaking the server rules, purchases on it are not refunded.</p>
<h2>Age</h2>
<p>If you're under 18, you need permission from a parent or guardian before buying.</p>
<h2>Chargebacks</h2>
<p>Opening a chargeback or payment dispute instead of contacting us may lead to the purchased credits being removed and the account being banned from the server.</p>
<h2>Changes to the game</h2>
<p>We may change, rebalance or remove in-game features, items and prices at any time to keep the game fair and running. The server may occasionally be offline for maintenance.</p>
<h2>Not affiliated</h2>
<p>GenBerry is not an official Minecraft product and is not approved by or associated with Mojang AB or Microsoft.</p>
<h2>Contact</h2>
<p>Questions? Open a ticket in our <a href="https://discord.gg/akXMTM5XMy">Discord</a>.</p>`],
refunds: ['Refund Policy', `
<p>Credits are digital goods delivered straight away, so all sales are final once the credits have been delivered to your account.</p>
<h2>When we'll help</h2>
<ul><li>You were charged but your credits never arrived.</li><li>You were charged more than once for the same purchase by mistake.</li><li>The credits went to the wrong account because of a typo (we'll move them for you).</li></ul>
<p>Contact us on <a href="https://discord.gg/akXMTM5XMy">Discord</a> within 14 days with your username and the email you paid with, and we'll fix it or refund you.</p>
<h2>Your rights under the law</h2>
<p>Nothing in this policy takes away rights you have under consumer protection laws, such as the Australian Consumer Law, that can't be excluded.</p>
<h2>Refunded purchases</h2>
<p>If a purchase is refunded or charged back, the credits from it (or what they were spent on) may be removed from your account.</p>`],
privacy: ['Privacy Policy', `
<p>This explains what information the GenBerry store collects and how it's used.</p>
<h2>What we collect</h2>
<ul><li><b>Your Minecraft username</b>, so we know which account to give your credits to.</li><li><b>Purchase details</b> (what you bought, when, the amount and the email you entered at checkout), kept so we can deliver purchases and help with support.</li></ul>
<h2>Payments</h2>
<p>Payments are processed by Stripe. Your card details go straight to Stripe and are never seen or stored by us. Stripe's privacy policy is at stripe.com/privacy.</p>
<h2>On this site</h2>
<p>We remember the username you typed in your own browser so you don't have to type it again. We don't use advertising or tracking cookies. Your player's face is shown using the public mc-heads.net service.</p>
<h2>How we use it</h2>
<p>Only to deliver your purchases, give support, prevent fraud, and keep records we're legally required to keep. We don't sell your information.</p>
<h2>Your choices</h2>
<p>You can ask us to see or delete the information we hold about you by contacting us on <a href="https://discord.gg/akXMTM5XMy">Discord</a>. Some payment records may need to be kept for tax and legal reasons.</p>`]
};
const route = () => {
  const k = location.hash.slice(1);
  const page = LEGAL[k];
  $('shop').hidden = !!page;
  $('legal').hidden = !page;
  if (page) { $('legal').innerHTML = `<a class="back" href="#">← Back to store</a><h1>${page[0]}</h1><p class="muted">Last updated ${UPDATED}</p>${page[1]}`; window.scrollTo(0, 0); }
};
window.addEventListener('hashchange', route);

renderLogin(); renderBasket(); route(); toast('Logged out'); };
  else $('lf').onsubmit = async e => {
    e.preventDefault();
    const v = $('un').value.trim();
    if (!/^[A-Za-z0-9_]{3,16}$/.test(v)) { $('ue').textContent = 'Usernames are 3 to 16 letters, numbers or _.'; return; }
    const btn = $('lf').querySelector('button'); btn.disabled = true; btn.textContent = 'Checking...';
    const found = await lookup(v);
    btn.disabled = false; btn.textContent = 'Continue';
    if (found === null) { $('ue').textContent = "We couldn't find that Minecraft account. Check the spelling."; return; }
    user = found ? found.name : v;
    userId = found ? found.id : '';
    try { userId ? localStorage.setItem('genberry-uuid', userId) : localStorage.removeItem('genberry-uuid'); } catch (e) {}
    save(); renderLogin(); renderBasket(); toast('Logged in as ' + user);
    basket >= 0 ? openPanel('basket') : closeAll();
  };
};

const renderBasket = () => {
  const p = PACKS[basket];
  $('count').hidden = basket < 0;
  $('basket').innerHTML = `<div class="ph">Basket<button class="x" data-close>×</button></div>
    <div class="pb">${p ? `<div class="line"><div class="t">${berries(basket)}</div><div style="flex:1"><b>${fmt(p.credits)} Credits</b><div class="muted">${user ? 'For ' + user : 'Log in to choose who gets it'}</div></div><b>${usd(p.price)}</b></div>
      <button class="btn ghost full" id="rm" style="margin-top:14px">Remove</button>` : `<p class="muted" style="margin-top:0">Your basket is empty.</p>`}</div>
    ${p ? `<div class="pf"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span>Total</span><b>${usd(p.price)} USD</b></div>
      ${user ? `<a class="btn full" href="${p.link}?client_reference_id=${encodeURIComponent(user)}">Checkout</a>` : `<button class="btn full" id="needLogin">Log in to checkout</button>`}</div>` : ''}`;
  $('basket').querySelector('[data-close]').onclick = closeAll;
  if (p) $('rm').onclick = () => { basket = -1; renderBasket(); };
  const nl = $('needLogin'); if (nl) nl.onclick = () => openPanel('login');
};

$('loginBtn').onclick = () => openPanel('login');
$('basketBtn').onclick = () => openPanel('basket');

const add = i => {
  if (!PACKS[i].link) { toast('Coming soon!'); return; }
  basket = i; renderBasket(); openPanel('basket');
};

const details = i => {
  const p = PACKS[i];
  $('dlg').innerHTML = `<div class="img">${berries(i)}</div><div class="in">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><h3>${fmt(p.credits)} Credits</h3><button class="x" data-close>×</button></div>
    <div style="font-size:20px;font-weight:700;margin-top:4px">${usd(p.price)} <span class="muted">USD</span></div>
    <ul><li>${fmt(p.credits)} credits delivered to your account in game</li><li>Arrives within a minute, even if you're offline</li><li>Spend on ranks, lootboxes and bundles with /store</li></ul>
    <button class="btn full" id="dAdd">${p.link ? 'Add to basket' : 'Coming soon'}</button></div>`;
  closeAll(); $('dlg').classList.add('open'); shade.classList.add('open');
  $('dlg').querySelector('[data-close]').onclick = closeAll;
  $('dAdd').onclick = () => add(i);
};

document.querySelectorAll('.pkg').forEach(c => {
  c.onclick = e => { const b = e.target.closest('[data-add]'); b ? add(+b.dataset.add) : details(+c.dataset.i); };
  c.onkeydown = e => { if (e.key === 'Enter') details(+c.dataset.i); };
});

renderLogin(); renderBasket();
}
</script>
</body>
</html>
